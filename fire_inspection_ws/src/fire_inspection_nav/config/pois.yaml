# 消防巡检点位配置 —— 导航服务端唯一配置源
#
# 点位坐标以底盘 POI 服务端（192.168.11.10:9090）为唯一真源，
# 本地只维护巡检顺序和超时，禁止在此写第二份坐标。
poi_source: chassis      # 目前只支持 chassis（local 未实现）

start_poi: start_point

poi_order:
  - POI_01
  - POI_02
  - POI_03
  - POI_04

# 轨道按名称指定：巡检段用 outbound，返程用 return（从 POI_04 到起点）
tracks:
  outbound: track_line_1000
  return: track_line_1001

# 只过点、不走巡检轨道的点位（POI_04 是返程轨道上轨点）
# 默认不停留，可用下面的 dwell_overrides 单独指定停留时间
transit_pois:
  - POI_04

timeouts:
  to_start_s: 180.0
  per_poi_s: 180.0

# 每个巡检点位到点后的停留时间（秒），起点、过点点位与返程不停留
dwell_s: 5.0

# 单点停留时间覆盖（优先级高于 dwell_s / transit_pois 的不停留默认）
# 巡检点只留短暂稳定时间，视觉检查由编排层在到点后触发
dwell_overrides:
  POI_01: 1.0
  POI_02: 1.0
  POI_03: 1.0
  POI_04: 3.0

# 分段限速（m/s）：巡检段与返程段分别下发，节点退出时恢复底盘原值
speed:
  outbound_mps: 0.4
  return_mps: 0.4

# 到点位置容差（米）：实际位姿与 POI 偏差超过该值则本次 goal 失败
arrival_tolerance_m: 0.5

# 到点朝向覆盖（rad）：只影响导航到点后的原地转向，不改底盘地图里的点位。
# POI_03 原先为 -60°（-1.0472），改为 -90° 与 POI_01/POI_02 同向，
# 面向走廊一侧。后续若在底盘地图里把该点朝向直接改成 -90°，可删除此覆盖。
yaw_overrides:
  POI_03: -1.5708

# 受阻自恢复 + 侧向绕行：底盘 AEB 只会刹停、没有绕障/重规划接口，导航层
# 「检测停滞 → 取消 → 后退一小段 → 向左/右绕行一段 → 点对点重发原目标」。
# 同侧挪不出自动换另一侧，两侧都失败则 phase=blocked，由编排层跳过该点并播报。
stall:
  enabled: true
  detect_window_s: 8.0      # 连续无有效位移达到该时长即判受阻（旋转段不检测）
  min_progress_m: 0.10      # 窗口内位移小于该值视为没有进展
  backoff_m: 0.5            # 后退距离（米），底盘要求 50~5000mm，代码内已限幅
  backoff_speed_mps: 0.2    # 后退限速（0 在底盘接口里表示不限速，禁止填 0）
  backoff_timeout_s: 5.0    # 单次后退的动作超时
  max_recoveries: 2         # 单段最多自恢复次数（第1次向左、第2次向右），用尽即判受阻
  detour_offsets_m: [1.0, 1.5]  # 侧向绕行距离（米），按恢复次数依次取，0.3~3.0
  detour_timeout_s: 30.0    # 单次侧向绕行的动作超时
  # 后退失败（后方也堵死）时的脱困动作：原地左右交替转向，让底盘 AEB/
  # 规划重新判断朝向，再重发原目标；转向也失败才判本段受阻。
  retreat_rotate_deg: 45.0          # 单次转向角度（度），第 1 次左、第 2 次右
  retreat_rotate_speed_rad_s: 0.30  # 转向角速度限速（0 在底盘接口里=不限速）
  retreat_rotate_timeout_s: 8.0     # 单次转向动作超时

# 人员接近（ApproachTarget）：视觉给出「方位角 + 距离」，导航负责安全地走到
# 目标前方 standoff 米并转向目标。所有距离/位移安全边界都在这里，
# 编排层不再重复配置一套阈值。
approach:
  standoff_m: 2.0          # 期望停车距离：走到目标前方约 2 米
  side_offset_m: 1.2       # 站位相对视线的侧向偏移（米）：>0 左侧、<0 右侧。
                           # 吸烟介入时从吸烟者侧向走开，不正面穿过人；
                           # 0 表示正前方（Action goal 里填 0 则用此默认值）
  min_range_m: 2.0         # 已小于该距离视为足够近，不再前进（只原地转向）
  retreat_offset_m: 1.2    # 已贴到下限以内时的侧向退让距离：人偏左向右退、偏右向左退，
                           # 横移让开通道后继续；0 表示退回「原地不接近」
  max_range_m: 10.0        # 超过该距离认为测距不可信/太远，原地播报不靠近
  max_travel_m: 8.0        # 单次接近最大位移，超出直接拒绝
  arrival_tolerance_m: 0.8 # 到位距离偏差告警阈值（只告警，不判失败）
  timeout_s: 60.0          # 单次接近动作超时
  speed_mps: 0.35          # 接近段限速，低于巡检 0.4 m/s

# 自动重定位：仅在实机模式（dry_run:=false）且定位异常时触发，
# dry_run 下永不调用底盘重定位接口。
# 初始位姿默认取 start_poi 的 x/y/yaw（开机时车应停在起点）；
# 确需覆盖时取消下面 pose 的注释。max_time_ms 可选，透传给底盘。
relocalize:
  enabled: true           # 一键脚本实机运行时会自动重定位；仍异常则拒绝导航
  timeout_s: 60.0         # 轮询 slam_status 的硬上限，超时即拒绝导航
  poll_interval_s: 0.5
  # max_time_ms: 60000
  # pose: {x: 0.0, y: 0.0, yaw: 0.0}

# 应用层软限位（超出即拒绝 goal），与现场物理护栏配合使用
# 现网消防地图实测范围约为 x 2.9~26.6、y 1.3~2.5，此处留足余量，
# 用于拦截数量级写错的坐标，而不是精确复刻现场边界。
range_limit:
  x: [-10.0, 45.0]
  y: [-20.0, 20.0]

# 人员接近 / 近距离退让 / 受阻绕行的临时落点可行走廊。
# range_limit 只拦「数量级写错」的坐标，范围很宽；这里填走廊物理边界
# （两侧墙面），代码先内缩 margin_m 再校验车中心点，越界一律保持原地、
# 只播报，绝不下发贴墙或必然失败的目标。
#
# 2026-11-02 现场实测（用户把车摆到可接受的最靠墙位置，底盘 REST 读数）：
#   左侧中心 y=2.550（x=9.612）、右侧中心 y=0.784（x=9.480）。
# 2026-11-03 点2→点3 的绕行落点 y≈1.00（x≈23.1）撞上门框，说明 0.784
# 只是个别人工摆位可达，门框区域更窄。因此把车中心下限从 0.784 收到 1.25：
#   下限 0.35 + 0.90 = 1.25；落点低于该值会先镜像到另一侧横移，
#   两侧都不可行才原地停车播报（不下发贴门框的目标）。
#   以后如需调整，只改这两个 y 值，margin_m 保持 0.90 即可。
#   x 方向是走廊长度方向（两端是通道），不做限制，仅由 range_limit 兜底。
corridor:
  y: [0.35, 3.450]
  margin_m: 0.90
