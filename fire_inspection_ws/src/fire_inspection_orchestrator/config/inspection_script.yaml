# 消防巡检流程配置 —— 编排层唯一真源
version: "0.2"
approved_version: "0.2"

start_poi: start_point
return_to_start: true

# 到点后头部回中完成后的稳定等待（秒）
settle_s: 1.0
# 视觉取帧超时（秒），透传给 InspectPoi.timeout_s
inspect_timeout_s: 5.0

# 全局阈值映射 —— 与视觉层 vision.yaml 单一来源，禁止自行漂移：
#   smoking 0.45：视觉层过滤阈值（2026-10-29 验收口径，不做框几何校验）；
#     是否停车介入由编排层多帧确认决定：需 ≥3 帧且跨度 ≥1.2s，
#     只有 conf≥0.90 才允许单帧确认（2026-11-01 误报治理）
#   其他类 0.65 收紧压制误检
conf_by_class:
  smoking: 0.45
  safety_sign: 0.65
  fire_extinguisher: 0.65

# 巡检点：expect 全部检出=正常，任一缺失=不确定；abnormal 命中=异常；
# focus_classes 是调用方显式指定的"本检查点专用目标类别"（如专查安全指示牌），
# 为空时沿用通用文案，绝不按 POI 名称猜测专用目标。
pois:
  - name: POI_01
    expect_classes: [fire_extinguisher]   # 第一个点位只查灭火器
    abnormal_classes: [smoking]
    focus_classes: []   # expect 已只含灭火器，留空即走灭火器固定文案
  - name: POI_02
    expect_classes: [safety_sign]
    abnormal_classes: [smoking]
    focus_classes: []   # 待现场确认
  - name: POI_03
    expect_classes: [safety_sign]
    abnormal_classes: [smoking]
    focus_classes: []   # 待现场确认

# 只经过、不做视觉检查的点位（POI_04 后沿返程轨道回起点）
transit_pois: [POI_04]

# 途中人员介入：导航途中连续确认到吸烟/行人 → 停车 → 先播报 →
# 向远离人员的一侧横移一小段（导航侧按走廊/软限位校验）→ 播报
# 「已避开，继续巡检」→ 重发同一个点位继续巡检。
# person 由视觉节点的人体检测模型给出（与消防三分类模型并行推理）。
# 安全边界（距离/位移/限速）全部在 pois.yaml 的 approach 段，这里只管策略。
intervention:
  enabled: true
  classes: [smoking, person]     # 只有这些类别会触发介入；其他类只播报
  # 只播报、不停车的类别：确认后抓拍 + 后台播报，不取消当前导航，
  # 车继续前往原目标执行巡检任务（行走中播报，不接近人员）。
  # 与 avoid_classes 互斥；音频警报（air_raid）不受此项影响。
  speak_only_classes: []
  # 需要「停车 → 先播报 → 侧向绕开人员 → 继续原目标」的类别。
  # 无有效方位角/测距时不会盲动，退化为只停车播报。
  avoid_classes: [smoking, person]
  # 绕行横移距离（米），0.3~3.0。现场 2026-11-03 返程用 1.5m 时车已
  # 贴着走廊一侧的门框，绕行后还卡在原地；1.0m 以内即可让开一个身位。
  avoid_offset_m: 0.8
  # 目标是否在机器人行进路线上的判定（只对 avoid_classes 生效）：
  # 横向偏移 = range*sin(bearing)。行人只有「在正前方路线上」才会锁定头部
  # 并播报：路外/远处的人直接忽略（不转头、不播报、不占冷却），否则
  # 头部被侧前方的人带偏，正前方真正挡路的人反而看不到。
  # 缺方位/缺测距时按“在路径上”处理，避免漏掉真正挡路的人。
  person_on_path:
    # 开始锁定的距离上限（对 person / smoking 同时生效）：超过该距离的人直接忽略
    # （不锁定、不播报、不占冷却）。仅深度相机测距 valid=True 时才生效；
    # 缺测距时按"在路径上"处理，避免漏掉真正挡路的人。
    # 0.5m 太小：车要贴到人跟前才锁定，现场 2026-11-03 等到 0.72m 才停下；
    # 2.0m 可在正前方提前锁定/预停车。
    max_range_m: 2.0
    lane_half_width_m: 0.5    # 横向偏移超过该值视为不在路径上
    max_bearing_rad: 0.35     # 方位角超过约 20° 也视为不在路径上
  max_per_poi: 3         # 同一导航点位最多介入次数（返程可能多次遇到行人）
  max_total: 10          # 本轮总上限
  settle_s: 0.5          # 停车后等待车身稳定再取新快照
  snapshot_wait_s: 2.0   # 等待一帧更新检测（含距离/方位角）的超时
  timeout_s: 60.0        # 接近动作总超时，0 表示用 pois.yaml 默认值
