# 消防巡检头部扫视配置（改这里不用重编译，但需要重启节点）

# 发布频率：/head/cmd 需要持续下发，100Hz 实测稳定
publish_rate_hz: 100.0
speed: 0.15
current: 2.0

# 每步过渡时长与停留时长：放慢节奏给视觉推理留时间。
# 实测头部 0.6rad 约 1.2s 到位，2.0s 过渡足够；停留 2.0s 让整轮扫视
# 约 24s 走完，与单段轨道（约 20s）同量级，避免「一趟只扫到半个扇区」。
step_duration_s: 2.0
step_dwell_s: 2.0

# look_at:<yaw>,<pitch> 转向目标的过渡时长（秒）
look_duration_s: 1.2
# center / stop 回中位的过渡时长（秒）
center_duration_s: 1.5

# true = 只打印不发布 /head/cmd（台架调试用）
dry_run: false

cmd_topic: /fire_inspection/head_sweep_cmd
status_topic: /fire_inspection/head_status
head_cmd_topic: /head/cmd
robot_state_topic: /robot_state

# 手柄急停：已按要求禁用（G 拨右 + E 拨上 不再触发）。
# 注意必须显式写成空列表，键缺失会回退到默认组合键，等于没关。
joy_topic: /sbus_data
stop_axes: []
axis_threshold: 0.5

# 开机自启时延迟多少秒开始扫视（等待 robot_control 与 /robot_state 就绪）
auto_start_delay_s: 30.0

# 关节：1=roll(保持0) 2=pitch(正=低头) 3=yaw(正=向左)
# 实测：相机装在头部偏高，目标（灭火器/烟头）都在视线下方，
# 所以整条序列整体下压，不再留抬头步。
# yaw 取 ±0.5rad（±29°），配合相机水平半视场 42.7°，两侧合计覆盖
# 车头左右约 ±71°，比原来的 ±0.35rad（±63°）多看一圈侧面。
steps:
  - {name: "大低头+左", pose: [0.0,  0.38,  0.50]}
  - {name: "大低头+右", pose: [0.0,  0.38, -0.50]}
  - {name: "中低头+左", pose: [0.0,  0.26,  0.50]}
  - {name: "中低头+右", pose: [0.0,  0.26, -0.50]}
  - {name: "平视+左", pose: [0.0,  0.00,  0.50]}
  - {name: "平视+右", pose: [0.0,  0.00, -0.50]}
