# 消防巡检语音配置
tts_service: /intelligent_interaction/tts/play
audio_id: audio_guide          # audio_config.json: priority=4, interruptible=true

timing:
  query_poll_s: 0.2
  playing_status: playing      # 精确匹配，禁止子串包含判断
  settle_s: 0.4                # 非播放状态防抖窗口
  est_char_rate_s: 0.22        # 文本时长估算：每字秒数
  est_min_duration_s: 1.5
  query_timeout_s: 30.0
